# plans/PLAN_PHASE2.md Phase 9 — single-file binaries + distribution channels.
# One ubuntu job cross-compiles win/mac/linux × x64/arm64 via Bun compile
# (research-verified targets), attaches artifacts + SHA256SUMS.txt to the tag's
# GitHub Release (PRD section 30), then optionally updates the external
# Homebrew tap and Scoop bucket when their PATs are configured. Missing secrets
# skip those jobs gracefully — the release itself never depends on them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Workflow-level env mirrors make the secrets readable inside job-level `if:` —
# GitHub does not expose `secrets` context there directly.
env:
  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps + build dashboard client
        run: |
          npm ci
          npm run build
      # The Homebrew formula installs from the npm tarball — publish FIRST so
      # the tap job never races a manual publish. Skipped cleanly without
      # NPM_TOKEN (then build-packaging runs with OH_SKIP_FORMULA=1 below).
      - name: Publish to npm if this version is not there yet
        if: env.NPM_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "opensource-hub@$VERSION" version >/dev/null 2>&1; then
            echo "already published — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Embed catalog/learn/client files BEFORE compiling — a compiled binary
      # has no project directory on disk (see src/server/repo-files.js).
      - name: Generate embedded payload
        run: node scripts/make-bun-payload.mjs
      - name: Compile binaries (6 targets)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-bin packaging
          for target in linux-x64 linux-arm64 windows-x64 windows-arm64 darwin-x64 darwin-arm64; do
            out="opensource-hub-v${VERSION}-${target}"
            if [[ "$target" == windows-* ]]; then out="${out}.exe"; fi
            bun build --compile --minify --target="bun-${target}" bin/cli.js --outfile "dist-bin/${out}"
          done
          cd dist-bin && sha256sum * > ../packaging/SHA256SUMS.txt && cd ..
      - name: Generate Homebrew formula + Scoop manifest
        # Formula needs the published tarball; when npm publishing was skipped
        # (no NPM_TOKEN) we still build the scoop manifest + sums for release.
        run: node scripts/build-packaging.mjs "${GITHUB_REF_NAME#v}"
        env:
          OH_REPO_SLUG: ${{ github.repository }}
          OH_SKIP_FORMULA: ${{ env.NPM_TOKEN == '' && '1' || '' }}
      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/*
            packaging/SHA256SUMS.txt

  homebrew-tap:
    runs-on: ubuntu-latest
    needs: binaries
    if: env.HOMEBREW_TAP_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build formula from the published npm tarball
        run: node scripts/build-packaging.mjs "${GITHUB_REF_NAME#v}"
        env:
          OH_REPO_SLUG: ${{ github.repository }}
      - name: Push formula to the tap
        run: |
          TAP_REPO="${OH_TAP_REPO:-${{ github.repository_owner }}/homebrew-tap}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/opensource-hub.rb tap/Formula/
          cd tap
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git add Formula/opensource-hub.rb
          git diff --cached --quiet || git commit -m "opensource-hub ${GITHUB_REF_NAME}"
          git push
        env:
          OH_TAP_REPO: ${{ vars.OH_TAP_REPO }}

  scoop-bucket:
    runs-on: ubuntu-latest
    needs: binaries
    if: env.SCOOP_BUCKET_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
        # Real exe hashes come from the SHA256SUMS attached by the binaries job.
      - name: Download checksums and regenerate manifest
        run: |
          test -n "${SCOOP_BUCKET_TOKEN}" # guard: skip logic already handled this
          gh release download "${GITHUB_REF_NAME}" --dir packaging --clobber --pattern "SHA256SUMS.txt"
          test -f packaging/SHA256SUMS.txt || { echo "SHA256SUMS.txt missing from release"; exit 1; }
          node scripts/build-packaging.mjs "${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
          OH_REPO_SLUG: ${{ github.repository }}
      - name: Push manifest to the bucket
        run: |
          BUCKET_REPO="${SCOOP_BUCKET_REPO:-${{ github.repository_owner }}/scoop-bucket}"
          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/${BUCKET_REPO}" bucket
          mkdir -p bucket/bucket
          cp packaging/scoop/opensource-hub.json bucket/bucket/
          cd bucket
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git add bucket/opensource-hub.json
          git diff --cached --quiet || git commit -m "opensource-hub ${GITHUB_REF_NAME}"
          git push
        env:
          SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
