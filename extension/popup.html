<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenSource Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: #F6F5F3;
      color: #18181B;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #18181B;
    }
    .status-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2.5px 7px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-online {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
    }
    .status-offline {
      background: #FFFBEB;
      color: #B45309;
      border: 1px solid #FDE68A;
    }
    .search-box {
      width: 100%;
      padding: 8px 12px;
      border: 0.8px solid #E6E4E1;
      border-radius: 8px;
      background: #FFFFFF;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 150ms;
    }
    .search-box:focus {
      border-color: #C2410C;
    }
    .results {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      padding: 9px 12px;
      background: #FFFFFF;
      border: 0.8px solid #E6E4E1;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: all 150ms ease;
    }
    .item:hover {
      border-color: #C2410C;
      background: #FAF9F6;
    }
    .item-title {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-sub {
      font-size: 11px;
      color: #71717A;
      margin-top: 2px;
    }
    .footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #71717A;
      padding-top: 10px;
      border-top: 0.8px solid #E6E4E1;
    }
    .footer a {
      color: #C2410C;
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span style="color:#C2410C;">◆</span> OpenSource Hub
    </div>
    <span id="engine-status" class="status-pill status-offline">● Checking...</span>
  </div>
  <input type="text" id="search" class="search-box" placeholder="Search paid tool (Notion, Figma, Slack)..." autofocus />
  <div id="results" class="results"></div>
  <div class="footer">
    <a id="local-link" href="http://localhost:3000" target="_blank" rel="noopener">Local Dashboard ↗</a>
    <a id="web-link" href="https://bengowtham70-dev.github.io/opensource-hub" target="_blank" rel="noopener">Web Directory ↗</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
