<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenSource Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F6F5F3;
      color: #18181B;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #18181B;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      background: #FFEDD5;
      color: #C2410C;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .search-box {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #E6E4E1;
      border-radius: 6px;
      background: #FFFFFF;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    .search-box:focus {
      border-color: #C2410C;
    }
    .results {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      padding: 8px 10px;
      background: #FFFFFF;
      border: 1px solid #E6E4E1;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color 0.15s;
    }
    .item:hover {
      border-color: #C2410C;
    }
    .item-title {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
    .item-sub {
      font-size: 11px;
      color: #71717A;
      margin-top: 2px;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #71717A;
    }
    .footer a {
      color: #C2410C;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>◆</span> OpenSource Hub
    </div>
    <span class="badge">Local Engine</span>
  </div>
  <input type="text" id="search" class="search-box" placeholder="Type paid tool (e.g. Notion, Figma)..." autofocus />
  <div id="results" class="results"></div>
  <div class="footer">
    <a href="http://localhost:3000" target="_blank">Open Full Dashboard →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
