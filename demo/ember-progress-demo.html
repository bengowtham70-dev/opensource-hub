<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Molten Progress — MetalForge-style recreation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(120% 90% at 50% 0%, #1d1714 0%, #100d0c 60%, #0a0908 100%);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e5e7eb;
    padding: 32px 16px;
  }
  .stage {
    width: min(820px, 100%);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header p { font-size: 13px; color: #9ca3af; margin-top: 4px; }
  .card {
    background: #181311;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 26px;
    box-shadow: rgba(0,0,0,0.45) 0 24px 60px -12px;
  }
  canvas { width: 100%; height: auto; display: block; border-radius: 14px; cursor: ew-resize; touch-action: none; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  button {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #e5e7eb;
    font: 500 13px/1 "Inter", system-ui, sans-serif;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 150ms ease;
  }
  button:hover { border-color: rgba(255,122,36,0.55); color: #FFD69E; }
  button.active { background: #AD3308; border-color: #FF7A24; color: #fff; }
  .readout {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: #9ca3af;
  }
  .readout b { color: #FF7A24; font-weight: 600; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .swatch {
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .swatch .chip { height: 34px; }
  .swatch .lbl {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 9px; font-size: 11px; color: #9ca3af;
  }
  .swatch .hex { color: #e5e7eb; font-weight: 500; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Ember Molten Progress</h1>
    <p>Standalone recreation of metalforge.xyz <code>effect=progress · style=spring</code> — full 100% molten fill with the complete palette ramp (gold tip included), spring lag, trails, bloom, pulse, jitter, grain. Drag the bar or use the buttons.</p>
  </header>

  <div class="card"><canvas id="fx" width="760" height="230"></canvas></div>

  <div class="row">
    <button id="b-auto">Auto sweep</button>
    <button data-p="25">25%</button>
    <button data-p="60">60%</button>
    <button data-p="85">85%</button>
    <button data-p="100" class="active">100%</button>
    <span class="readout">fill <b id="ro">100.0%</b></span>
  </div>

  <div class="swatches" id="swatches"></div>
</div>

<script>
(() => {
  const PALETTE = ["#190602", "#401204", "#AD3308", "#FF7A24", "#FFD69E", "#AD3308", "#FF7A24"];
  const P = {
    progress: 60, lag: 0.42, echo: 0.055, bloom: 1, jitter: 0.3,
    stagger: 0.18, pulse: 0.28, pulseRate: 3, trails: 3,
    haze: 1, vignette: 1, grain: 0.01, corner: 0.144
  };

  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;

  const M = 30;
  const BX = M, BY = M + 6;
  const BW = W - M * 2, BH = H - (M + 6) * 2;
  const RAD = Math.max(6, BH * P.corner);

  let target = 1;
  let auto = false;
  let pos = 0, vel = 0;
  const hist = [];

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  const grainCv = document.createElement("canvas");
  grainCv.width = grainCv.height = 96;
  (() => {
    const g = grainCv.getContext("2d");
    const img = g.createImageData(96, 96);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  })();
  const grainPat = ctx.createPattern(grainCv, "repeat");

  function fillGradient(width) {
    const g = ctx.createLinearGradient(BX, 0, BX + Math.max(2, width), 0);
    const stops = [0, 0.18, 0.38, 0.58, 0.78, 0.9, 1];
    stops.forEach((s, i) => g.addColorStop(s, PALETTE[i]));
    return g;
  }

  function histAt(ageSec, now) {
    const t = now - ageSec;
    for (let i = hist.length - 1; i >= 0; i--) {
      if (hist[i].t <= t) return hist[i].p;
    }
    return hist.length ? hist[0].p : pos;
  }

  function stepSpring(dt) {
    const k = 150 - 118 * P.lag;
    const c = 17 - 9 * P.lag;
    vel += ((target - pos) * k - vel * c) * dt;
    pos += vel * dt;
  }

  function pulseMod(t) {
    return 1 + P.pulse * Math.sin((2 * Math.PI * t) / P.pulseRate);
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#181311");
    bg.addColorStop(1, "#120e0c");
    ctx.fillStyle = bg;
    rr(ctx, 0, 0, W, H, 14);
    ctx.fill();

    const cx = W / 2, cy = H / 2;
    if (P.haze) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const hz = ctx.createRadialGradient(cx, cy, 10, cx, cy, BW * 0.55);
      hz.addColorStop(0, "rgba(173,51,8," + (0.13 * P.haze).toFixed(3) + ")");
      hz.addColorStop(0.55, "rgba(255,122,36," + (0.05 * P.haze).toFixed(3) + ")");
      hz.addColorStop(1, "rgba(255,122,36,0)");
      ctx.fillStyle = hz;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    ctx.save();
    rr(ctx, BX, BY, BW, BH, RAD);
    ctx.clip();

    ctx.fillStyle = "rgba(255,255,255,0.035)";
    ctx.fillRect(BX, BY, BW, BH);

    const fillW = Math.max(2, BW * Math.min(1, Math.max(0, pos)));

    if (P.trails > 0) {
      for (let i = P.trails; i >= 1; i--) {
        const age = i * P.stagger;
        const tp = histAt(age, now);
        const tw = Math.max(2, BW * Math.min(1, Math.max(0, tp)));
        const a = P.echo * (P.trails - i + 1) * 1.6;
        ctx.globalAlpha = Math.min(0.5, a);
        ctx.fillStyle = fillGradient(tw);
        ctx.fillRect(BX, BY, tw, BH);
      }
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = fillGradient(fillW);
    ctx.fillRect(BX, BY, fillW, BH);

    const sheen = ctx.createLinearGradient(0, BY, 0, BY + BH);
    sheen.addColorStop(0, "rgba(255,214,158,0.16)");
    sheen.addColorStop(0.35, "rgba(255,255,255,0.02)");
    sheen.addColorStop(1, "rgba(0,0,0,0.25)");
    ctx.fillStyle = sheen;
    ctx.fillRect(BX, BY, fillW, BH);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const jx = (Math.random() * 2 - 1) * P.jitter * 6;
    const hx = BX + fillW + jx;
    const hot = ctx.createRadialGradient(hx, cy, 2, hx, cy, BH * 1.15);
    const pm = pulseMod(now);
    hot.addColorStop(0, "rgba(255,214,158," + (0.85 * pm).toFixed(3) + ")");
    hot.addColorStop(0.3, "rgba(255,122,36," + (0.5 * pm).toFixed(3) + ")");
    hot.addColorStop(1, "rgba(173,51,8,0)");
    ctx.fillStyle = hot;
    ctx.fillRect(hx - BH * 1.3, BY - 10, BH * 2.6, BH + 20);

    ctx.save();
    ctx.shadowColor = "rgba(255,122,36," + (0.9 * pm).toFixed(3) + ")";
    ctx.shadowBlur = 42;
    ctx.fillStyle = "rgba(255,122,36," + (0.28 * P.bloom * pm).toFixed(3) + ")";
    ctx.fillRect(BX, BY, fillW, BH);
    ctx.restore();

    const under = ctx.createRadialGradient(hx, cy, 4, hx, cy, BH * 2.4);
    under.addColorStop(0, "rgba(255,122,36," + (0.22 * pm).toFixed(3) + ")");
    under.addColorStop(1, "rgba(255,122,36,0)");
    ctx.fillStyle = under;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.restore();

    rr(ctx, BX, BY, BW, BH, RAD);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    ctx.stroke();

    if (P.vignette) {
      const vg = ctx.createRadialGradient(cx, cy, H * 0.35, cx, cy, W * 0.62);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0," + (0.5 * P.vignette).toFixed(2) + ")");
      ctx.fillStyle = vg;
      rr(ctx, 0, 0, W, H, 14);
      ctx.fill();
    }

    if (grainPat && P.grain > 0) {
      ctx.save();
      ctx.globalAlpha = P.grain * 3.2;
      ctx.globalCompositeOperation = "overlay";
      ctx.fillStyle = grainPat;
      ctx.translate(Math.random() * 48, Math.random() * 48);
      ctx.fillRect(-48, -48, W + 96, H + 96);
      ctx.restore();
    }
  }

  let last = performance.now() / 1000;
  function loop(ms) {
    const now = ms / 1000;
    let dt = now - last;
    last = now;
    dt = Math.min(dt, 1 / 30);
    if (auto && !dragging) {
      target = 0.625 + 0.375 * Math.sin(now * 0.45);
    }
    stepSpring(dt);
    hist.push({ t: now, p: pos });
    while (hist.length > 240) hist.shift();
    draw(now);
    ro.textContent = (Math.min(1, Math.max(0, pos)) * 100).toFixed(1) + "%";
    requestAnimationFrame(loop);
  }

  let dragging = false;
  function pointerTarget(e) {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    return Math.min(1, Math.max(0, (x - BX) / BW));
  }
  cv.addEventListener("pointerdown", e => {
    dragging = true;
    setAuto(false);
    target = pointerTarget(e);
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", e => { if (dragging) target = pointerTarget(e); });
  cv.addEventListener("pointerup", () => { dragging = false; });

  const ro = document.getElementById("ro");
  const bAuto = document.getElementById("b-auto");
  function setAuto(v) {
    auto = v;
    bAuto.classList.toggle("active", v);
    if (v) document.querySelectorAll("button[data-p]").forEach(x => x.classList.remove("active"));
  }
  bAuto.addEventListener("click", () => setAuto(true));
  document.querySelectorAll("button[data-p]").forEach(b => {
    b.addEventListener("click", () => {
      setAuto(false);
      document.querySelectorAll("button[data-p]").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      target = parseInt(b.dataset.p, 10) / 100;
    });
  });

  const sw = document.getElementById("swatches");
  [...PALETTE, "#181311"].forEach((hex, i) => {
    const d = document.createElement("div");
    d.className = "swatch";
    d.innerHTML =
      '<div class="chip" style="background:' + hex + '"></div>' +
      '<div class="lbl"><span>' + (i < PALETTE.length ? "color" + (i + 1) : "background") + '</span><span class="hex">' + hex.toUpperCase() + "</span></div>";
    sw.appendChild(d);
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
