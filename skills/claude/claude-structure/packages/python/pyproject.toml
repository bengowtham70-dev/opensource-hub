[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-structure"
version = "1.0.0"
description = "A ready-to-use Claude Code project scaffold — rules, commands, skills, agents, and hooks in one command."
readme = "README.md"
license = { file = "../../LICENSE" }
authors = [
  { name = "TechSphereX TA", email = "support@techspherex.com" }
]
keywords = ["claude", "claude-code", "ai", "scaffold", "llm", "anthropic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/KhaiTrang1995/claude-code-structure"
Repository = "https://github.com/KhaiTrang1995/claude-code-structure.git"
"Bug Tracker" = "https://github.com/KhaiTrang1995/claude-code-structure/issues"
Changelog = "https://github.com/KhaiTrang1995/claude-code-structure/blob/main/CHANGELOG.md"

[project.scripts]
claude-init = "claude_code_structure.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["claude_code_structure"]
artifacts = ["claude_code_structure/template/**"]

[tool.hatch.build.targets.sdist]
include = [
  "claude_code_structure/",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
